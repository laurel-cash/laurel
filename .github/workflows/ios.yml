# The iPhone build (docs/IOS.md): GitHub's macOS runners do what this tree can't do
# on Windows. Runs on the `ios` branch and by hand. A push to `testflight` (or a run by
# hand with `testflight`: GitHub offers that only once this file is on main) also signs
# and uploads, with the App Store Connect key held as the repository's secrets.
name: iOS

on:
  push:
    branches: [ ios, testflight ]
  workflow_dispatch:
    inputs:
      testflight:
        description: Also sign the device build and upload it to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LAUREL_FEATURES: v1

jobs:
  # the simulator app from the Xcode project in src-tauri/gen/apple, then a first start:
  # a screenshot and the app's log, uploaded to be looked at
  simulator:
    name: Simulator
    runs-on: macos-26  # App Store Connect takes only apps built with Xcode 26 or later
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
          brew install xcodegen
          npm ci
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ios-sim-26-${{ hashFiles( 'src-tauri/Cargo.lock' ) }}
          restore-keys: ios-sim-26-
      - name: Build
        run: npx tauri ios build --target aarch64-sim --debug --ci --features v1
      - name: First start
        run: |
          UDID=$( xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load( sys.stdin )[ "devices" ]
          print( next( x[ "udid" ] for k, v in sorted( d.items(), reverse = True ) if "iOS" in k for x in v if x[ "name" ].startswith( "iPhone" ) ) )' )
          echo "device $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" src-tauri/gen/apple/build/arm64-sim/Laurel.app
          xcrun simctl launch --console-pty "$UDID" cash.laurel.wallet > app-console.log 2>&1 &
          sleep 40
          mkdir -p out
          xcrun simctl io "$UDID" screenshot out/first-start.png
          xcrun simctl spawn "$UDID" launchctl list | grep -i laurel > out/running.txt || echo "not running" > out/running.txt
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "Laurel"' > out/app.log || true
          cp app-console.log out/ || true
          cat out/running.txt
          tail -n 40 out/app.log
      # the text size in the iPhone's own web view (useTextScale: WebKit's page zoom): the
      # setting written as Laurel writes it, Laurel started again, a picture beside the first
      - name: Text size
        run: |
          C=$( xcrun simctl get_app_container "$UDID" cash.laurel.wallet data )
          D=$( find "$C/Library" -maxdepth 3 -type d -name cash.laurel.wallet | head -n 1 )
          echo "data folder: ${D:-none}"
          ls -la "$D" || true
          for SIZE in 100 150; do
            echo "{\"textScale\":$SIZE}" > "$D/laurel-settings.json"
            xcrun simctl terminate "$UDID" cash.laurel.wallet || true
            xcrun simctl launch "$UDID" cash.laurel.wallet
            sleep 25
            xcrun simctl io "$UDID" screenshot out/text-$SIZE.png
          done
      - name: Keep the screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-start
          path: out
          if-no-files-found: warn
          retention-days: 14
      # the device build, signed by Xcode with the API key (automatic signing), its build
      # number this run's, then uploaded; the key file exists only for these two commands
      - name: TestFlight
        if: inputs.testflight || github.ref == 'refs/heads/testflight'
        env:
          APPLE_API_KEY: ${{ secrets.ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          export APPLE_API_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          printf '%s\n' "$ASC_KEY_P8" > "$APPLE_API_KEY_PATH"
          npx tauri ios build --export-method app-store-connect --build-number ${{ github.run_number }} --ci --features v1
          IPA=$( find src-tauri/gen/apple/build -name '*.ipa' | head -n 1 )
          echo "uploading $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

  # the phone's screens in the iPhone's own WebKit, with a finger's swipe and the home
  # bar's safe area (scripts/check_layout_ios.mjs): what Edge's layout check can't see
  web:
    name: Web
    runs-on: macos-26
    timeout-minutes: 30
    # safaridriver doesn't reach the runner's simulator Safari yet ("timed out while
    # connecting to a Safari instance", booted first or not, 11-26): said, not blocking
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tools
        run: |
          npm ci
          sudo safaridriver --enable
      # booted before safaridriver asks for it: started cold by the driver, Safari took
      # longer than its wait (the first run, 11-26)
      - name: Simulator
        run: |
          UDID=$( xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load( sys.stdin )[ "devices" ]
          print( next( x[ "udid" ] for k, v in sorted( d.items(), reverse = True ) if "iOS" in k for x in v if x[ "name" ].startswith( "iPhone" ) ) )' )
          echo "IOS_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.mobilesafari RemoteAutomationEnabled -bool YES
          xcrun simctl spawn "$UDID" defaults write com.apple.WebInspector RemoteAutomationEnabled -bool YES
          xcrun simctl launch "$UDID" com.apple.mobilesafari
          sleep 15
      - name: Layout
        run: node scripts/check_layout_ios.mjs
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/web
          if-no-files-found: warn
          retention-days: 14
