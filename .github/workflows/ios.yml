# The iPhone build (docs/IOS.md): GitHub's macOS runners do what this tree can't do
# on Windows. Runs on the `ios` branch and by hand; nothing here signs or uploads yet.
name: iOS

on:
  push:
    branches: [ ios ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LAUREL_FEATURES: v1

jobs:
  # the simulator app from the Xcode project in src-tauri/gen/apple, then a first start:
  # a screenshot and the app's log, uploaded to be looked at
  simulator:
    name: Simulator
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
          brew install xcodegen
          npm ci
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ios-sim-${{ hashFiles( 'src-tauri/Cargo.lock' ) }}
          restore-keys: ios-sim-
      - name: Build
        run: npx tauri ios build --target aarch64-sim --debug --ci --features v1
      - name: First start
        run: |
          UDID=$( xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load( sys.stdin )[ "devices" ]
          print( next( x[ "udid" ] for k, v in sorted( d.items(), reverse = True ) if "iOS" in k for x in v if x[ "name" ].startswith( "iPhone" ) ) )' )
          echo "device $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" src-tauri/gen/apple/build/arm64-sim/Laurel.app
          xcrun simctl launch --console-pty "$UDID" cash.laurel.wallet > app-console.log 2>&1 &
          sleep 40
          mkdir -p out
          xcrun simctl io "$UDID" screenshot out/first-start.png
          xcrun simctl spawn "$UDID" launchctl list | grep -i laurel > out/running.txt || echo "not running" > out/running.txt
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "Laurel"' > out/app.log || true
          cp app-console.log out/ || true
          cat out/running.txt
          tail -n 40 out/app.log
      - name: Keep the screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-start
          path: out
          if-no-files-found: warn
          retention-days: 14
