<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Laurel</title>
		<!-- before the page's script: a web view older than Laurel's floor (vite.config.ts,
		     WEBVIEW_FLOOR) can't read it, and would show nothing. Old syntax on purpose -->
		<script>
			( function () {
				var m = /Chrome\/(\d+)/.exec( navigator.userAgent );
				if ( !m || +m[1] >= %WEBVIEW_FLOOR% ) {
					return;
				}
				window.__laurelOld = true;
				var phone = /Android/.test( navigator.userAgent );
				document.addEventListener( "DOMContentLoaded", function () {
					document.getElementById( "old" ).hidden = false;
					document.getElementById( "old-version" ).textContent = m[1];
					document.getElementById( "old-how" ).textContent = phone
						? "Open the Play Store, find Android System WebView, and tap Update. Then open Laurel again."
						: "Update Microsoft Edge WebView2 from Windows Update, then open Laurel again.";
				} );
			} )();
		</script>
		<style>
			#old { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
				font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5faf8; color: #0b2530; text-align: center; }
			#old[hidden] { display: none; }
			#old div { max-width: 340px; }
			#old svg { width: 64px; height: 64px; padding: 16px; border-radius: 22px; background: #4cc47c; color: #0b2530; box-sizing: border-box; }
			#old h1 { font-size: 22px; line-height: 1.25; margin: 20px 0 8px; font-weight: 650; }
			#old p { margin: 0 0 12px; color: rgba( 11, 37, 48, 0.66 ); }
			@media ( prefers-color-scheme: dark ) {
				#old { background: #081e2a; color: #e7f4ef; }
				#old p { color: #93a9ac; }
			}
		</style>
	</head>

	<body>
		<div id="old" role="alert" hidden>
			<div>
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
				<h1>Laurel Needs a Newer Web View</h1>
				<p>Laurel draws its screens with your system's web view, and this one (version <span id="old-version"></span>) is too old for it. Your wallets are safe.</p>
				<p id="old-how"></p>
			</div>
		</div>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
